<!doctype html>
<html lang="en">
  {% include head.html %}
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      background: var(--pink) url("/assets/page/9136728_1965.svg");
    }

    .menu,
    .menu ul,
    footer ul {
      background: transparent;
    }

    .index-container {
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    h1 {
      color: #ffb4fa;
      font-size: 5rem;
      opacity: .7;
      padding: 1rem;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: url("/assets/page/9136728_1965-dark.svg");
      }

      h1 {
        color: #434343;
        opacity: 1;
      }
    }
  </style>

  <body class="index">
    {% include menu.html %}
    <div class="index-container">
      <!-- <h1>seeking<br />stories<br />beauty<br />meaning</h1> -->

</html>
