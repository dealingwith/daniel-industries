---
layout: archive
title: Categories
---

<div style="margin-bottom: 1em;">
  <p><a id="sort" data-sort="numposts" href="#" onclick="sortAlpha()"
      style="font-weight: normal; text-decoration: underline;">Sort by name instead</a></p>
</div>

<div id="cat_toc" class="category-frequency-chart" data-expanded="false">
  {% category_toc %}
</div>
<button id="toggle-categories" type="button" onclick="toggleAllCategories()">Show all categories</button>

{% category_list %}

<script>
  function sortAlpha() {
    // determine current sort based on data-sort attribute
    const sort = document.getElementById('sort').getAttribute('data-sort');
    const parentDiv = document.getElementById('cat_toc');
    const childDivs = Array.from(parentDiv.querySelectorAll('.category-frequency-row'));
    if (sort === 'numposts') {
      const sortedDivs = childDivs.sort((a, b) => a.getAttribute('data-category').localeCompare(b.getAttribute('data-category')));
      sortedDivs.forEach((div) => parentDiv.appendChild(div));
      document.getElementById('sort').setAttribute('data-sort', 'alpha');
      document.getElementById('sort').innerText = 'Sort by number of posts instead';
    } else {
      const sortedDivs = childDivs.sort((a, b) => parseInt(b.getAttribute('data-numposts'), 10) - parseInt(a.getAttribute('data-numposts'), 10));
      sortedDivs.forEach((div) => parentDiv.appendChild(div));
      document.getElementById('sort').setAttribute('data-sort', 'numposts');
      document.getElementById('sort').innerText = 'Sort by name instead';
    }
    applyCategoryLimit();
    updateCategoryFrequencyChart();
  }

  function toggleAllCategories() {
    const categoryToc = document.getElementById('cat_toc');
    if (!categoryToc) return;

    const isExpanded = categoryToc.getAttribute('data-expanded') === 'true';
    categoryToc.setAttribute('data-expanded', isExpanded ? 'false' : 'true');
    applyCategoryLimit();
  }

  function applyCategoryLimit() {
    const categoryToc = document.getElementById('cat_toc');
    const toggleButton = document.getElementById('toggle-categories');
    if (!categoryToc || !toggleButton) return;

    const categoryRows = Array.from(categoryToc.querySelectorAll('.category-frequency-row'));
    const isExpanded = categoryToc.getAttribute('data-expanded') === 'true';

    categoryRows.forEach((row, index) => {
      row.classList.toggle('category-extra', index >= 20);
      row.classList.toggle('hidden', !isExpanded && index >= 20);
    });

    toggleButton.hidden = categoryRows.length <= 20;
    toggleButton.innerText = isExpanded ? 'Show fewer categories' : `Show all categories (${categoryRows.length})`;
    if (!isExpanded) window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
